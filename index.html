<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สวัสดีครับ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Srisakdi:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .container {
            display: flex;
            flex-direction: row; /* ทำให้รูปและข้อความอยู่ในแนวนอน */
            align-items: center;
        }

        .text {
            font-size: 50px;
            font-family: 'Srisakdi', cursive;
            margin-left: 50px; /* ระยะห่างของตัวหนังสือจากรูป */
        }

        .highlight {
            font-size: 60px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="IMG_4348.jpeg" alt="รูปนะจ๊ะอิอิ" style="max-width:250px;">
        <div class="text-container">
            <p class="text highlight">ลหนอ</p>
            <p class="text">
                เมื่อยามเย็น เห็นภาพ น่าหลงใหล<br>
                ข้าจึงใคร่ สงสัย ผู้ใดหนอ<br>
                เปิดคอมเม้น ซักถาม ไม่รีรอ<br>
                พ่อรูปหล่อ ลิ้งอยู่ไหน ไอ้สันดาน
            </p>
        </div>
    </div>
</body>
</html>
